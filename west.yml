# West manifest: this repository and the Zephyr it builds against, which `west update`
# fetches beside it (setup.sh). Only the modules the firmware uses.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import:
        name-allowlist:
          - mbedtls
          - tf-psa-crypto
          - littlefs
          - picolibc

  self:
    path: ti60_ac_inout_psu
