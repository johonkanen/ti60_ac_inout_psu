# RISC-V standard debug of the Sapphire SoC on the Ti60F225 development kit.
# The debug module is reached through the FPGA JTAG TAP, user instruction USER1 (BSCAN tunnel).
adapter driver ftdi
ftdi device_desc "Titanium Ti60F225 Development Kit"
ftdi vid_pid 0x0403 0x6011
ftdi channel 1
ftdi layout_init 0x08 0x0b
adapter speed 6000

transport select jtag
jtag newtap fpga_spinal bridge -expected-id 0x10660A79 -irlen 5 -ircapture 0x5 -irmask 0xF
target create fpga_spinal.cpu0 riscv -endian little -chain-position fpga_spinal.bridge -coreid 0 \
    -work-area-phys 0xF9000000 -work-area-size 1024
riscv use_bscan_tunnel 6 1
riscv set_bscan_tunnel_ir 8
gdb_port 3333
