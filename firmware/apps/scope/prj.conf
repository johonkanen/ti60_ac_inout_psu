CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=131072

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
# captures are up to 64 KB, the stack needs room to stream them
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=1536
# 32 KB: a 64 KB window loses segments on the way out and waits for their retransmits (a 512 KB
# scope capture took 516 ms to send, 320 ms at 32 KB, the same down to 8 KB: the CPU's limit)
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768

CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
# a WebSocket context per /ws client (scope.c MAX_CLIENTS): Zephyr's default is one
CONFIG_WEBSOCKET_MAX_CONTEXTS=6
CONFIG_HTTP_SERVER_MAX_CLIENTS=6
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
# the web client from flash: index.html.gz etc. served to browsers that take gzip
CONFIG_HTTP_SERVER_COMPRESSION=y
CONFIG_HTTP_SERVER_STATIC_FS_RESPONSE_SIZE=4096
CONFIG_HTTP_SERVER_STACK_SIZE=8192
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=16
CONFIG_EVENTFD=y

# no entropy source in the SoC; fine for this, not for TLS
CONFIG_TEST_RANDOM_GENERATOR=y
# %f in the JSON messages
CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y

# firmware update: POST zephyr.bin to /update (fpga/ti60_evm_eth/update.sh)
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y
CONFIG_FW_UPDATE=y

# web client files in a littlefs on the storage partition, /files/ to replace them
# (upload_web.sh)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# littlefs blocks are the flash layout's pages: 4 KB sectors, not the default 64 KB blocks
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_HTTP_FILES=y
